        function evaluateDeckExpression(expr, data) {
            if (!Array.isArray(expr) || expr.length === 0) {
                return expr;
            }
            const op = expr[0];
            if (op === 'get') {
                const propName = expr[1];
                if (data && data.properties && propName in data.properties) {
                    return data.properties[propName];
                }
                if (data && propName in data) {
                    return data[propName];
                }
                return undefined;
            }
            if (op === 'has') {
                const propName = expr[1];
                if (data && data.properties && propName in data.properties) {
                    return true;
                }
                if (data && propName in data) {
                    return true;
                }
                return false;
            }
            if (op === 'literal') {
                return expr[1];
            }
            if (['+', '-', '*', '/'].includes(op)) {
                const a = evaluateDeckExpression(expr[1], data);
                const b = evaluateDeckExpression(expr[2], data);
                if (op === '+') return a + b;
                if (op === '-') return a - b;
                if (op === '*') return a * b;
                if (op === '/') return a / b;
            }
            if (['==', '!=', '>', '<', '>=', '<='].includes(op)) {
                const a = evaluateDeckExpression(expr[1], data);
                const b = evaluateDeckExpression(expr[2], data);
                if (op === '==') return a === b;
                if (op === '!=') return a !== b;
                if (op === '>') return a > b;
                if (op === '<') return a < b;
                if (op === '>=') return a >= b;
                if (op === '<=') return a <= b;
            }
            return expr;
        }

        function evaluateDeckProps(value) {
            if (Array.isArray(value)) {
                if (value.length > 0 && typeof value[0] === 'string' && ['get', 'has', 'literal', '+', '-', '*', '/', '==', '!=', '>', '<', '>=', '<='].includes(value[0])) {
                    return function(d) {
                        return evaluateDeckExpression(value, d);
                    };
                }
                return value;
            }
            return value;
        }

        class MaplibreumDeckGLOverlayManager {
            constructor(map, overlays) {
                this.map = map;
                this.configs = {};
                this.activeLayers = {};
                this.dataCache = {};
                this.pendingData = {};
                (overlays || []).forEach((overlay) => {
                    const normalised = Object.assign({}, overlay);
                    const props = normalised.props || {};
                    normalised.props = {
                        json: Object.assign({}, props.json || {}),
                    };
                    this.configs[normalised.id] = normalised;
                });
            }

            _getConfig(id) {
                const config = this.configs[id];
                if (!config) {
                    console.warn(`Deck.GL overlay '${id}' is not registered.`);
                }
                return config;
            }

            _resolveData(config) {
                const cacheKey = config.id;
                if (Object.prototype.hasOwnProperty.call(this.dataCache, cacheKey)) {
                    return Promise.resolve(this.dataCache[cacheKey]);
                }
                if (!config.data) {
                    return Promise.resolve(undefined);
                }
                if (config.data.mode === 'inline') {
                    this.dataCache[cacheKey] = config.data.value;
                    return Promise.resolve(config.data.value);
                }
                if (config.data.mode === 'promise') {
                    if (this.pendingData[cacheKey]) {
                        return this.pendingData[cacheKey];
                    }
                    let factory;
                    try {
                        factory = new Function(`return (${config.data.value});`);
                    } catch (error) {
                        return Promise.reject(error);
                    }
                    let promise;
                    try {
                        promise = Promise.resolve(factory());
                    } catch (error) {
                        return Promise.reject(error);
                    }
                    this.pendingData[cacheKey] = promise
                        .then((result) => {
                            delete this.pendingData[cacheKey];
                            this.dataCache[cacheKey] = result;
                            return result;
                        })
                        .catch((error) => {
                            delete this.pendingData[cacheKey];
                            throw error;
                        });
                    return this.pendingData[cacheKey];
                }
                return Promise.resolve(undefined);
            }

            _buildProps(config, data) {
                const jsonProps = (config.props && config.props.json) || {};
                const props = { data };
                Object.entries(jsonProps).forEach(([key, value]) => {
                    props[key] = evaluateDeckProps(value);
                });
                return props;
            }

            addOverlay(id) {
                if (this.activeLayers[id]) {
                    return this.activeLayers[id];
                }
                const config = this._getConfig(id);
                if (!config) {
                    return null;
                }
                if (typeof deck === 'undefined') {
                    console.error('Deck.GL library is not loaded');
                    return null;
                }
                const customLayer = {
                    id: config.id,
                    type: 'custom',
                    renderingMode: '3d',
                    onAdd: (map, gl) => {
                        customLayer.__cancelled = false;
                        this._resolveData(config)
                            .then((data) => {
                                if (customLayer.__cancelled) {
                                    return;
                                }
                                try {
                                    const layerProps = this._buildProps(config, data);
                                    customLayer.__deck = new deck.Deck({
                                        gl,
                                        map,
                                        initialViewState: map.getFreeCameraOptions(),
                                        layers: [new deck[config.layerType](layerProps)],
                                    });
                                } catch (error) {
                                    console.error(
                                        `Failed to initialise Deck.GL overlay ${config.id}`,
                                        error
                                    );
                                }
                            })

                                console.error(
                                    `Failed to load data for Deck.GL overlay ${config.id}`,

                            });
                    },
                    render: () => {
                        if (customLayer.__deck && this.map.getFreeCameraOptions) {
                            const viewState = this.map.getFreeCameraOptions();
                            customLayer.__deck.setProps({ viewState });
                        }
                    },
                    onRemove: () => {
                        customLayer.__cancelled = true;
                        if (customLayer.__deck) {
                            customLayer.__deck.finalize();
                            customLayer.__deck = null;
                        }
                    },
                };
                try {
                    this.map.addLayer(customLayer, config.before || undefined);
                    this.activeLayers[id] = customLayer;
                } catch (error) {
                    console.error(`Failed to add Deck.GL overlay ${config.id}`, error);
                }
                return customLayer;
            }

            removeOverlay(id) {
                const layer = this.activeLayers[id];
                if (!layer) {
                    return;
                }
                layer.__cancelled = true;
                try {
                    this.map.removeLayer(id);
                } catch (error) {
                    console.warn(`Failed to remove Deck.GL overlay ${id}`, error);
                }
                if (layer.__deck) {
                    layer.__deck.finalize();
                    layer.__deck = null;
                }
                delete this.activeLayers[id];
            }
        }

function(gl, args) {
    const EXTENT = 8192;
    const uniforms = [
        'u_matrix',
        'u_projection_fallback_matrix',
        'u_projection_matrix',
        'u_projection_clipping_plane',
        'u_projection_transition',
        'u_projection_tile_mercator_coords',
    ];
    const tilesToRender = [];

    function generateTileList(list, current) {
        list.push(current);
        const subdivide = current.z < 2 || (current.x === current.y && current.z < 3) || (current.x === 0 && current.y === 0 && current.z < 7);
        if (subdivide) {
            for (let x = 0; x < 2; x++) {
                for (let y = 0; y < 2; y++) {
                    generateTileList(list, {
                        x: current.x * 2 + x,
                        y: current.y * 2 + y,
                        z: current.z + 1,
                        wrap: current.wrap,
                    });
                }
            }
        }
    }

    for (let i = -1; i <= 1; i++) {
        generateTileList(tilesToRender, {x: 0, y: 0, z: 0, wrap: i});
    }

    const getShader = (gl, shaderDescription) => {
        if (this.shaderMap.has(shaderDescription.variantName)) {
            return this.shaderMap.get(shaderDescription.variantName);
        }

        const vertexSource = `#version 300 es
        ${shaderDescription.vertexShaderPrelude}
        ${shaderDescription.define}

        in vec2 a_pos;
        out mediump vec2 v_pos;

        void main() {

            gl_Position = projectTile(a_pos);
            v_pos = a_pos / float(${EXTENT});
        }`;

        const fragmentSource = `#version 300 es

        precision mediump float;

        in vec2 v_pos;

        out highp vec4 fragColor;
        void main() {
            float alpha = 0.5;
            fragColor = vec4(v_pos, 0.0, 1.0) * alpha;
        }`;

        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexSource);
        gl.compileShader(vertexShader);

        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentSource, fragmentSource);
        gl.compileShader(fragmentShader);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        this.aPos = gl.getAttribLocation(program, 'a_pos');

        const locations = {};

        for (const uniform of uniforms) {
            locations[uniform] = gl.getUniformLocation(program, uniform);
        }

        const result = {
            program,
            locations
        };

        this.shaderMap.set(shaderDescription.variantName, result);

        return result;
    };

    const getTileMesh = (gl, x, y, z, border) => {
        const granularity = map.style.projection.subdivisionGranularity.tile.getGranularityForZoomLevel(z);
        const north = y === 0;
        const south = y === (1 << z) - 1;
        const key = `${granularity}_${north}_${south}_${border}`;
        if (this.meshMap.has(key)) {
            return this.meshMap.get(key);
        }

        const meshBuffers = maplibregl.createTileMesh({
            granularity,
            generateBorders: border,
            extendToNorthPole: north,
            extendToSouthPole: south,
        }, '16bit');

        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(
            gl.ARRAY_BUFFER,
            meshBuffers.vertices,
            gl.STATIC_DRAW
        );
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        const ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
        gl.bufferData(
            gl.ELEMENT_ARRAY_BUFFER,
            meshBuffers.indices,
            gl.STATIC_DRAW
        );
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);

        const mesh = {
            vbo,
            ibo,
            indexCount: meshBuffers.indices.byteLength / 2,
        };
        this.meshMap.set(key, mesh);
        return mesh;
    };

    const {program, locations} = getShader(gl, args.shaderData);

    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.STENCIL_TEST);
    gl.disable(gl.CULL_FACE);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(program);

    const isGlobeProjection = args.shaderData.variantName === 'globe';

    for (const tile of tilesToRender) {
        if (isGlobeProjection && tile.wrap !== 0) {
            continue;
        }

        const tileID = {
            wrap: tile.wrap,
            canonical: {
                x: tile.x,
                y: tile.y,
                z: tile.z,
            }
        };

        const projectionData = map.transform.getProjectionData({overscaledTileID: tileID, applyGlobeMatrix: true});

        gl.uniform4f(
            locations['u_projection_clipping_plane'],
            ...projectionData.clippingPlane
        );
        gl.uniform1f(
            locations['u_projection_transition'],
            projectionData.projectionTransition
        );

        gl.uniform4f(
            locations['u_projection_tile_mercator_coords'],
            ...projectionData.tileMercatorCoords
        );

        gl.uniformMatrix4fv(
            locations['u_projection_matrix'],
            false,
            projectionData.mainMatrix
        );
        gl.uniformMatrix4fv(
            locations['u_projection_fallback_matrix'],
            false,
            projectionData.fallbackMatrix
        );
        const mesh = getTileMesh(gl, tile.x, tile.y, tile.z, false);
        gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vbo);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ibo);
        gl.enableVertexAttribArray(this.aPos);
        gl.vertexAttribPointer(this.aPos, 2, gl.SHORT, false, 0, 0);
        gl.drawElements(gl.TRIANGLES, mesh.indexCount, gl.UNSIGNED_SHORT, 0);
    }
}

        // Load MapLibre 6's ES module build, with an independent CDN fallback.
        async function loadMapLibreGL() {
            const moduleUrls = [
                'https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs',
                'https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl.mjs'
            ];
            let lastError;
            for (const url of moduleUrls) {
                try {
                    const module = await import(url);
                    window.maplibregl = {
                        ...module,
                        version: module.version || module.getVersion?.(),
                    };
                    return window.maplibregl;
                } catch (error) {
                    lastError = error;
                    console.warn(`Failed to load MapLibre GL JS from ${url}`, error);
                }
            }
            throw new Error('Failed to load MapLibre GL JS from all CDNs', {
                cause: lastError
            });
        }

        function evaluateDeckExpression(expr, data) {
            if (!Array.isArray(expr) || expr.length === 0) {
                return expr;
            }
            const op = expr[0];
            if (op === 'get') {
                const propName = expr[1];
                if (data && data.properties && propName in data.properties) {
                    return data.properties[propName];
                }
                if (data && propName in data) {
                    return data[propName];
                }
                return undefined;
            }
            if (op === 'has') {
                const propName = expr[1];
                if (data && data.properties && propName in data.properties) {
                    return true;
                }
                if (data && propName in data) {
                    return true;
                }
                return false;
            }
            if (op === 'literal') {
                return expr[1];
            }
            if (['+', '-', '*', '/'].includes(op)) {
                const a = evaluateDeckExpression(expr[1], data);
                const b = evaluateDeckExpression(expr[2], data);
                if (op === '+') return a + b;
                if (op === '-') return a - b;
                if (op === '*') return a * b;
                if (op === '/') return a / b;
            }
            if (['==', '!=', '>', '<', '>=', '<='].includes(op)) {
                const a = evaluateDeckExpression(expr[1], data);
                const b = evaluateDeckExpression(expr[2], data);
                if (op === '==') return a === b;
                if (op === '!=') return a !== b;
                if (op === '>') return a > b;
                if (op === '<') return a < b;
                if (op === '>=') return a >= b;
                if (op === '<=') return a <= b;
            }
            return expr;
        }

        function evaluateDeckProps(value) {
            if (Array.isArray(value)) {
                if (value.length > 0 && typeof value[0] === 'string' && ['get', 'has', 'literal', '+', '-', '*', '/', '==', '!=', '>', '<', '>=', '<='].includes(value[0])) {
                    return function(d) {
                        return evaluateDeckExpression(value, d);
                    };
                }
                return value;
            }
            return value;
        }

        class MaplibreumDeckGLOverlayManager {
            constructor(map, overlays) {
                this.map = map;
                this.configs = {};
                this.activeLayers = {};
                this.dataCache = {};
                this.pendingData = {};
                (overlays || []).forEach((overlay) => {
                    const normalised = Object.assign({}, overlay);
                    const props = normalised.props || {};
                    normalised.props = {
                        json: Object.assign({}, props.json || {}),
                    };
                    this.configs[normalised.id] = normalised;
                });
            }

            _getConfig(id) {
                const config = this.configs[id];
                if (!config) {
                    console.warn(`Deck.GL overlay '${id}' is not registered.`);
                }
                return config;
            }

            _resolveData(config) {
                const cacheKey = config.id;
                if (Object.prototype.hasOwnProperty.call(this.dataCache, cacheKey)) {
                    return Promise.resolve(this.dataCache[cacheKey]);
                }
                if (!config.data) {
                    return Promise.resolve(undefined);
                }
                if (config.data.mode === 'inline') {
                    this.dataCache[cacheKey] = config.data.value;
                    return Promise.resolve(config.data.value);
                }
                if (config.data.mode === 'promise') {
                    if (this.pendingData[cacheKey]) {
                        return this.pendingData[cacheKey];
                    }
                    let factory;
                    try {
                        factory = new Function(`return (${config.data.value});`);
                    } catch (error) {
                        return Promise.reject(error);
                    }
                    let promise;
                    try {
                        promise = Promise.resolve(factory());
                    } catch (error) {
                        return Promise.reject(error);
                    }
                    this.pendingData[cacheKey] = promise
                        .then((result) => {
                            delete this.pendingData[cacheKey];
                            this.dataCache[cacheKey] = result;
                            return result;
                        })
                        .catch((error) => {
                            delete this.pendingData[cacheKey];
                            throw error;
                        });
                    return this.pendingData[cacheKey];
                }
                return Promise.resolve(undefined);
            }

            _buildProps(config, data) {
                const jsonProps = (config.props && config.props.json) || {};
                const props = { data };
                Object.entries(jsonProps).forEach(([key, value]) => {
                    props[key] = evaluateDeckProps(value);
                });
                return props;
            }

            addOverlay(id) {
                if (this.activeLayers[id]) {
                    return this.activeLayers[id];
                }
                const config = this._getConfig(id);
                if (!config) {
                    return null;
                }
                if (typeof deck === 'undefined') {
                    console.error('Deck.GL library is not loaded');
                    return null;
                }
                const customLayer = {
                    id: config.id,
                    type: 'custom',
                    renderingMode: '3d',
                    onAdd: (map, gl) => {
                        customLayer.__cancelled = false;
                        this._resolveData(config)
                            .then((data) => {
                                if (customLayer.__cancelled) {
                                    return;
                                }
                                try {
                                    const layerProps = this._buildProps(config, data);
                                    customLayer.__deck = new deck.Deck({
                                        gl,
                                        map,
                                        initialViewState: map.getFreeCameraOptions(),
                                        layers: [new deck[config.layerType](layerProps)],
                                    });
                                } catch (error) {
                                    console.error(
                                        `Failed to initialise Deck.GL overlay ${config.id}`,
                                        error
                                    );
                                }
                            })
                            .catch((error) => {
                                console.error(
                                    `Failed to load data for Deck.GL overlay ${config.id}`,
                                    error
                                );
                            });
                    },
                    render: () => {
                        if (customLayer.__deck && this.map.getFreeCameraOptions) {
                            const viewState = this.map.getFreeCameraOptions();
                            customLayer.__deck.setProps({ viewState });
                        }
                    },
                    onRemove: () => {
                        customLayer.__cancelled = true;
                        if (customLayer.__deck) {
                            customLayer.__deck.finalize();
                            customLayer.__deck = null;
                        }
                    },
                };
                try {
                    this.map.addLayer(customLayer, config.before || undefined);
                    this.activeLayers[id] = customLayer;
                } catch (error) {
                    console.error(`Failed to add Deck.GL overlay ${config.id}`, error);
                }
                return customLayer;
            }

            removeOverlay(id) {
                const layer = this.activeLayers[id];
                if (!layer) {
                    return;
                }
                layer.__cancelled = true;
                try {
                    this.map.removeLayer(id);
                } catch (error) {
                    console.warn(`Failed to remove Deck.GL overlay ${id}`, error);
                }
                if (layer.__deck) {
                    layer.__deck.finalize();
                    layer.__deck = null;
                }
                delete this.activeLayers[id];
            }
        }
